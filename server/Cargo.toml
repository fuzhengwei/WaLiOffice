[package]
name = "walioffice"
version = "0.2.0"
edition = "2021"
description = "WaLiOffice - Web AI Agent for office workflows"

[[bin]]
name = "walioffice"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# SSE streaming
async-stream = "0.3"
futures = "0.3"

# HTTP client for LLM
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

# Static asset embedding
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Document rendering
docx-rs = "0.4"
rust_xlsxwriter = "0.79"
zip = "2"

async-trait = "0.1"

tokio-stream = "0.1"

# Misc
regex = "1"
urlencoding = "2"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
