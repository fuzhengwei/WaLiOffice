# ── WaLiOffice Docker 镜像构建并推送到 Docker Hub + 阿里云 ACR ──
# 触发条件：push 到 main 分支、打 v* 标签、手动触发
name: Build and Push Docker Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: fuzhengwei
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: fuzhengwei
  IMAGE_NAME: walioffice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # ── 1. 检出代码 ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 设置镜像标签 ──
      - name: Set Image Tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_SUFFIX=":${VERSION}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            TAG_SUFFIX=":latest,:sha-${GITHUB_SHA::7}"
          else
            TAG_SUFFIX=":run-${{ github.run_number }}"
          fi

          # Docker Hub 标签
          DH_TAGS=""
          IFS=',' read -ra PARTS <<< "$TAG_SUFFIX"
          for part in "${PARTS[@]}"; do
            [[ -n "$DH_TAGS" ]] && DH_TAGS+=","
            DH_TAGS+="${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}${part}"
          done

          # 阿里云 ACR 标签
          ALIYUN_TAGS=""
          for part in "${PARTS[@]}"; do
            [[ -n "$ALIYUN_TAGS" ]] && ALIYUN_TAGS+=","
            ALIYUN_TAGS+="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.IMAGE_NAME }}${part}"
          done

          echo "dh_tags=${DH_TAGS}" >> $GITHUB_OUTPUT
          echo "aliyun_tags=${ALIYUN_TAGS}" >> $GITHUB_OUTPUT
          echo "all_tags=${DH_TAGS},${ALIYUN_TAGS}" >> $GITHUB_OUTPUT
          echo "dh_latest=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      # ── 3. 设置 Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. 登录 Docker Hub ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. 登录阿里云 ACR（如果配置了 Secrets 则登录）──
      - name: Login to Aliyun ACR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # ── 6. 构建并推送镜像 ──
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.all_tags }}
          # 多架构构建（可选，需要时取消注释）
          # platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      # ── 7. 输出镜像信息 ──
      - name: Image Info
        run: |
          echo "✅ 镜像构建并推送成功！"
          echo ""
          echo "📦 Docker Hub："
          echo "${{ steps.tags.outputs.dh_tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "📦 阿里云 ACR："
          echo "${{ steps.tags.outputs.aliyun_tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "🐳 拉取命令："
          echo "  docker pull ${{ steps.tags.outputs.dh_latest }}"
